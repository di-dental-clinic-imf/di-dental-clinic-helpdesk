<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0A53A2">
  <meta name="description" content="DI Dental Clinic Help Desk">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>DI Dental Clinic - Help Desk</title>
</head>
<body>
<main class="app">
  <header class="header">
    <img src="clinic-header.jpg" alt="DI Dental Clinic" class="clinic-header-image">
    <p>Help Desk</p>
  </header>

  <section id="loginSection" class="card section active">
    <h2>Staff Login</h2>
    <form id="loginForm">
      <label>Username<input id="username" type="text" autocomplete="username" required></label>
      <label>Password<div class="password-field"><input id="password" type="password" autocomplete="current-password" required><button id="togglePassword" type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">Show</button></div></label>
      <button class="primary" type="submit">Login</button>
    </form>
  </section>

  <div id="appContent" class="hidden">
    <div class="selected-patient" style="margin:12px 12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <span id="loggedInUser"></span>
      <button id="logoutButton" type="button" class="tab" style="flex:0 0 auto;padding:8px 12px;">Logout</button>
    </div>

    <nav class="tabs">
      <button class="tab active" data-section="newPatientSection">New Patient</button>
      <button class="tab" data-section="treatmentSection">Collect Payment</button>
    </nav>

    <section id="newPatientSection" class="card section active">
      <h2>Register New Patient</h2>
      <form id="registerForm">
        <label>Patient Name<input id="name" type="text" autocomplete="name" required></label>
        <label>Mobile Number<input id="mobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" required></label>
        <label>Appointment Date<input id="appointmentDate" type="date" required></label>
        <label>Appointment Time<input id="appointmentTime" type="time" required></label>
        <button class="primary" type="submit">Register Patient</button>
      </form>
    </section>

    <section id="treatmentSection" class="card section">
      <h2>Collect Payment</h2>
      <form id="treatmentForm">
        <label>Find Patient
        <div class="patient-search-row">
          <input id="patientSearch" type="search" placeholder="Search name, mobile or Patient ID" autocomplete="off">
          <button id="clearPatientSearch" class="secondary clear-patient-button" type="button" title="Clear patient search">Clear</button>
        </div>
      </label>
        <div id="patientSearchResults" class="patient-search-results hidden" aria-live="polite"></div>
        <div id="selectedPatient" class="selected-patient hidden" aria-live="polite"></div>
        <input id="patientId" type="hidden" required>
        <label>Treatment Type
          <select id="treatmentType" required>
            <option value="" selected disabled>Select treatment</option>
            <option>Consultation</option><option>Dental Cleaning / Scaling</option><option>Filling</option><option>Extraction</option><option>Root Canal Treatment</option><option>Pulpectomy</option><option>Crown / Bridge</option><option>Denture</option><option>Implant</option><option>Orthodontic</option><option>Follow-up</option><option>Other</option>
          </select>
        </label>
        <label>Treatment Case
          <select id="treatmentCase">
            <option value="" selected>New Treatment Case</option>
          </select>
        </label>
        <div id="caseSummary" class="selected-patient hidden" aria-live="polite"></div>
        <label>Payment Amount (₹)<input id="paymentAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Enter payment amount" required></label>
        <button class="primary" type="submit">Save Payment</button>
      </form>
      <p class="hint">For a new treatment, keep “New Treatment Case”. For another payment for the same treatment, select the existing case. Agreed amount changes are handled by Admin.</p>
    </section>
  </div>

  <div id="message" class="message hidden" role="status" aria-live="polite"></div>
  <footer><span id="connectionStatus">Ready</span></footer>
  <footer>© 2026 DI Dental Clinic. All rights reserved.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
